name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,server]"
      - name: Run package tests (no torch/Metal/Athena dependencies)
        run: >-
          pytest tests/ -v --tb=short --cov=dpf --cov-report=term-missing
          --ignore=tests/test_metal_gpu_consolidated.py
          --ignore=tests/test_3d_electrode_bc.py
          --ignore=tests/test_walrus_consolidated.py
          --ignore=tests/test_athena_consolidated.py
          --ignore=tests/_archive
          -k "not metal and not Metal and not athena and not mlx"
          -m "not slow"
          -n auto
      - name: Verify test count
        run: |
          # Threshold sized for the no-torch/Metal/Athena CI subset.
          # 4000 was set when those backends were installed in CI; the current
          # workflow excludes them by design (test step `--ignore` flags + `-k`
          # filter above). After removing 3 fabricated tests (2026-04-24 audit)
          # and the no-backend collection limits, baseline in CI is ~2600.
          # Floor at 2500 catches regressions where collection silently drops
          # more than ~100 tests.
          count=$(pytest tests/ --co -q -m "not slow" 2>&1 | tail -1 | grep -oE '[0-9]+' | head -1)
          echo "Found ${count:-0} non-slow tests"
          if [ -z "$count" ] || [ "$count" -lt 2500 ]; then
            echo "ERROR: Expected at least 2500 non-slow tests, found ${count:-0}"
            exit 1
          fi

  validation:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,server]"
      - name: Run validation gate (experimental data)
        run: pytest tests/test_validation_ci.py -v --tb=short

  first-principles-audit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,server]"
      - name: Verify first-principles source-truth exhaustion
        run: python scripts/verify_first_principles_source_truth_exhaustion.py --strict
      - name: Verify first-principles module source vetting
        run: python scripts/verify_first_principles_module_source_vetting.py --strict
      - name: Audit first-principles result artifacts
        run: python scripts/audit_first_principles_artifacts.py 'results/*.json'

  smoke-test:
    runs-on: ubuntu-latest
    needs:
      - test
      - first-principles-audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,server]"
      - name: CLI smoke test (Cartesian)
        run: python -m dpf.cli.main simulate config.json --steps=10
      - name: CLI smoke test (Cylindrical)
        run: python -m dpf.cli.main simulate config_cylindrical.json --steps=10
      - name: Server smoke test
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from dpf.server.app import app
          client = TestClient(app)
          r = client.get('/api/health')
          assert r.status_code == 200
          data = r.json()
          assert data['status'] == 'ok'
          assert 'backends' in data
          assert data['backends']['python'] is True
          r = client.get('/api/presets')
          assert r.status_code == 200
          assert len(r.json()) >= 3
          r = client.post('/api/simulations', json={'config': {}, 'preset': 'tutorial', 'max_steps': 3})
          assert r.status_code == 200
          print(f'Server smoke test passed: sim_id={r.json()[\"sim_id\"]}')
          "

  # Optional Athena++ tests — requires compiled C++ binaries (macOS only).
  # This job is expected to fail on GitHub-hosted runners since Athena++ is
  # not compiled in CI. It exists as a template for self-hosted runners with
  # Athena++ built.
  athena-test:
    runs-on: macos-latest
    needs: lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Init Athena++ submodule (best-effort)
        run: git submodule update --init --depth=1 external/athena || echo "Athena++ submodule fetch failed — skipping"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,server]"
      - name: Check Athena++ availability
        run: |
          python -c "
          from dpf.athena_wrapper import is_available
          avail = is_available()
          print(f'Athena++ available: {avail}')
          if not avail:
              print('Athena++ not compiled — skipping Athena++ tests')
          "
      - name: Run Athena++ wrapper tests
        run: pytest tests/test_athena_wrapper.py tests/test_dual_engine.py -v --tb=short || true
      - name: Run Athena++ verification tests (non-slow)
        run: pytest tests/test_phase_f_verification.py -v --tb=short -m "not slow" || true
